name: Audit

# Weekly audits (task 06.2/05): known-CVE scan of the locked dependencies, and an OFFLINE
# selector-drift regression guard over the committed HTML corpus (no network, no API key).
# The optional live drift job only runs on a manual dispatch with `live: true`.

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live selector-drift check against one real URL per site"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: Export locked requirements
        run: uv export --frozen --no-hashes --no-emit-project > requirements-audit.txt

      - name: Audit for known vulnerabilities
        run: uvx pip-audit -r requirements-audit.txt --strict --progress-spinner off

  drift-offline:
    name: selector drift (offline corpus)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: amazon
            html: tests/fixtures/html/amazon/cpp_primer_5e.html
          - site: packtpub
            html: tests/fixtures/html/packtpub/cpp_windows_programming.html
          - site: oreilly
            html: tests/fixtures/html/oreilly/cpp_in_a_nutshell.html
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Check current selectors against the stored snapshot
        # Exit 4 = drift (a current selector matches nothing), 1 = error; both fail the job.
        env:
          SITE: ${{ matrix.site }}
          HTML: ${{ matrix.html }}
        run: >
          uv run bookscraper detect-schema --site "$SITE"
          --html-file "$HTML" --check-current-only --format json
          --output "drift-$SITE.json" > /dev/null

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-offline-${{ matrix.site }}
          path: drift-${{ matrix.site }}.json
          if-no-files-found: warn

  drift-live:
    name: selector drift (live)
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: amazon
            url: https://www.amazon.com/dp/0321714113
          - site: packtpub
            url: https://www.packtpub.com/product/c-windows-programming/9781786464224
          - site: oreilly
            url: https://www.oreilly.com/library/view/c-in-a/0596002985/
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Check current selectors against the live page
        id: drift
        env:
          SITE: ${{ matrix.site }}
          URL: ${{ matrix.url }}
        run: |
          set +e
          uv run bookscraper detect-schema --site "$SITE" \
            --url "$URL" --check-current-only --format json \
            --output "drift-live-$SITE.json" > /dev/null
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Open or update a drift issue
        if: steps.drift.outputs.code == '4'
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ matrix.site }}
        run: |
          title="Selector drift: $SITE"
          body="Live selector check exited 4 (drift). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --search "\"$title\" in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-live-${{ matrix.site }}
          path: drift-live-${{ matrix.site }}.json
          if-no-files-found: warn

      - name: Fail on any non-drift error
        if: steps.drift.outputs.code != '0' && steps.drift.outputs.code != '4'
        run: exit 1
