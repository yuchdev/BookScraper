src = ["src"]
line-length = 120
target-version = "py313"

extend-exclude = [
    "tests/flake8_lint/samples"
]

[lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "SIM102",
    "SIM108",
    "C4",
    "UP017",
    "UP037"
]

#   UP007 - Union[...] -> X | Y; Optional[X] -> X | None
#   SIM300 - Yoda condition x == f(a, b)
#   E402 - module level import not at top of file
#   E501 - the line is too long
ignore = [
    "UP007",
    "SIM300",
    "E402",
    "E501"
]

[lint.per-file-ignores]
# B027: StorageBackend.close() is an intentional no-op default hook (not every backend holds
# a connection), not a forgotten @abstractmethod.
"src/bookscraper/backends/storage.py" = ["B027"]

[lint.isort]
# Keep explicit `name as name` re-exports in one import statement.
combine-as-imports = true
