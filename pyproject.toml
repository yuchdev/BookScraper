[project]
name = "bookscraper"
version = "1.0.0"
description = "Asyncio + Playwright scraper for book metadata from Amazon, Packtpub, Leanpub, and O'Reilly, with JSON or MongoDB Atlas storage."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Yurii Cherkasov" },
]
keywords = [
    "scraper",
    "books",
    "metadata",
    "playwright",
    "asyncio",
    "mongodb",
    "amazon",
    "leanpub",
    "packtpub",
    "oreilly",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "playwright>=1.50.0",
    "python-dotenv>=1.0.1",
    "pymongo>=4.11.2",
    "httpx>=0.28.1",
    "anthropic>=0.40.0",
    "cryptography>=50.0.1",
]

[project.urls]
Repository = "https://github.com/yuchdev/BookScraper"
Issues = "https://github.com/yuchdev/BookScraper/issues"
Documentation = "https://github.com/yuchdev/BookScraper/tree/master/docs"

[project.scripts]
bookscraper = "bookscraper.main:main_sync"

[build-system]
# PEP 639 SPDX license expression (`license = "MIT"`) requires setuptools>=77; uv's isolated
# build env resolves the newest setuptools, and the floor is bumped here so a build never picks
# an older setuptools that would reject the SPDX string. Backend stays setuptools (no concrete
# reason to switch to hatchling/uv_build; the stray egg-info is cleaned by the build step, not a
# backend defect).
requires = [
    "setuptools>=77",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.24.0",
    "mongomock>=4.3.0",
    "flakeforge==1.1.0",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
# tests/integration/ hits a real MongoDB Atlas cluster and requires real credentials (see
# CLAUDE.md's Testing section) - excluded by default so `uv run pytest` stays fast and offline;
# run it explicitly with `uv run pytest -m integration`.
addopts = "-m \"not integration\""
# Collect only our own suite; other checkouts symlinked into the repo root (e.g. a local
# Scrapegraph-ai clone kept for evaluation) must never be swept into a bare `pytest` run.
testpaths = ["tests"]
markers = [
    "integration: hits a real external service (MongoDB Atlas); requires real credentials, excluded by default",
    "chromium: runs the offline corpus harness in real headless Chromium; offline and fast, included by default (CI installs Chromium via task 06.2), skips cleanly when no browser is usable",
]
asyncio_mode = "auto"

[tool.flakeforge]

include = ["src", "tests"]

exclude = []

select = ["X001", "X002", "X003", "X004", "X005", "X006", "X007", "X008", "X009", "X010", "X011", "X012", "X013", "X014", "X015"]

# Pre-existing violations accepted at migration time (the plugin was never
# actually wired into Flake8 before, so these were invisible until now).
# Gates only *new* violations from here on; see flakeforge's baseline docs.
baseline = "flakeforge-baseline.json"

# When false, a `# noqa` comment never suppresses a violation (the rule
# engine's noqa support is bypassed entirely). Default true.
allow_noqa = true

# Whitelist: when non-empty, only files/directories listed here may use `# noqa`.
# When empty, all files not in `noqa_forbidden` are permitted.
noqa_allowed = []

# Blacklist: files/directories where `# noqa` is strictly forbidden (violations always fire).
# Blacklist always wins over `noqa_allowed`.
noqa_forbidden = []

[tool.coverage.run]
source = ["bookscraper"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
    "if __name__ == .__main__.:",
]
